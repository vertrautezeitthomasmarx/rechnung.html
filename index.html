i{background:white;border:1px solid #e0e6ee;border-radius:12px;padding:13px}.kpi b{font-size:22px;display:block;margin:5px 0}.kpi small{color:#607185}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#ecf0f5;color:#294b6a;font-size:12px}.err{background:#fff1ee;border:1px solid #efb2a6;color:#7d2820;padding:12px;border-radius:10px;margin:10px 0}.ok{background:#edf7f0;color:#275d36;padding:10px;border-radius:10px;margin-bottom:12px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:1}.small{font-size:12px}.right{text-align:right}.invisible{display:none!important}.invoice-preview{display:none}.tableScroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #d8e0e7;padding:9px 5px;text-align:left;vertical-align:top}th{background:#edf2f6}.empty{padding:15px 0;color:#687889}.dangertext{color:#8f3b36}details{margin-top:10px}summary{cursor:pointer;font-weight:600}

</style></head><body><header><h1>Vertraute Zeit · Rechnungen</h1><small>Zeiten · Leistungen · Abrechnung</small></header><main id="app"></main><nav class="no-print" id="nav"><button data-tab="home"><span>⌂</span>Übersicht</button><button data-tab="customers"><span>♙</span>Kunden</button><button data-tab="entry"><span>＋</span>Erfassen</button><button data-tab="invoices"><span>▤</span>Rechnungen</button><button data-tab="settings"><span>⚙</span>Mehr</button></nav><section class="invoice-preview" id="printArea"></section><script>
'use strict';
const KEY='vz_iphone_invoice_v1';const TYPES=['Begleitung','Gespräch','Kleine Unternehmung','Spiele und Unterhaltung','Erledigungen','Formulare','Sonstiges'];const FEES=['Parkgebühren','Fahrtkostenpauschale','Sonstiges'];const RATES=[27,28,30,32,35,37,39];const STATUSES=['Entwurf','Versendet','Teilweise bezahlt','Bezahlt','Storniert'];
const COMPANY={name:'Vertraute Zeit Thomas Marx - Echte Momente gemeinsam gestalten - Für mehr Freude und Gespräche im Alter - Tel. 0172 87 07 638',address:'Klettenweg 11',city:'99097 Erfurt',phone:'0172 87 07 638',mail:'thomas.marx@vertraute-zeit.de',iban:'DE80 1101 0101 5197 9750 10',bic:'SOBKDEB2XXX',bank:'Solaris SE',tax:'151/247/09315'};
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const monthNow=()=>today().slice(0,7);const dmy=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}`:'–';const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const round=n=>Math.round((n+Number.EPSILON)*100)/100;const nval=v=>{const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:NaN};const validClock=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);const minutes=(a,b)=>{if(!validClock(a)||!validClock(b))return NaN;const x=a.split(':').map(Number),y=b.split(':').map(Number);return y[0]*60+y[1]-x[0]*60-x[1]};const plusDays=(s,d)=>{const dt=new Date(s+'T12:00:00');dt.setDate(dt.getDate()+d);return [dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('-')};const monthEnd=m=>{const [y,mo]=m.split('-').map(Number);return `${y}-${String(mo).padStart(2,'0')}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`};
function fresh(){return {version:1,customers:[],entries:[],invoices:[],nextByYear:{},updated:today()}}let db;let tab='home';let editCustomer=null;let editEntry=null;let selection={customer:'',month:monthNow()};let notice='';let invoiceView=null;let formMode='time';
try{db=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(db.customers)||!Array.isArray(db.entries)||!Array.isArray(db.invoices))throw Error('Ungültige Datenstruktur')}catch(e){db=fresh();notice='Gespeicherte Daten konnten nicht geladen werden. Neue Einträge sind bis zur Wiederherstellung gesperrt.';window.storageDamaged=true}
function snapshot(){return JSON.parse(JSON.stringify(db))}
function persist(previous){if(window.storageDamaged){db=previous;alert('Gespeicherte Daten sind beschädigt. Bitte zuerst eine gültige Sicherung importieren.');return false}try{db.updated=today();localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){db=previous;alert('Speichern fehlgeschlagen. Die Änderung wurde zurückgenommen. Bitte Speicher prüfen und Daten sichern.');return false}}
function save(){return persist(snapshot())}
function validDate(v){if(typeof v!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(v))return false;let d=new Date(v+'T12:00:00');return !Number.isNaN(d.getTime())&&[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===v}
function overlap(entry,excludeId){return db.entries.find(e=>e.id!==excludeId&&e.customerId===entry.customerId&&e.kind==='time'&&e.date===entry.date&&entry.start<e.end&&e.start<entry.end)}
function validBackup(d){
 const fail=(m)=>{throw Error(m)};
 const money=(n)=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&Math.abs(n*100-Math.round(n*100))<0.00001;
 const unique=(arr)=>new Set(arr).size===arr.length;
 if(!d||d.version!==1||!Array.isArray(d.customers)||!Array.isArray(d.entries)||!Array.isArray(d.invoices)||!d.nextByYear||typeof d.nextByYear!=='object'||Array.isArray(d.nextByYear)||d.customers.length>15)fail('Ungültige Datenstruktur');
 if(!unique(d.customers.map(x=>x.id))||!unique(d.entries.map(x=>x.id))||!unique(d.invoices.map(x=>x.id))||!unique(d.invoices.map(x=>x.number)))fail('Doppelte Kennungen oder Rechnungsnummern');
 const cm=new Map(d.customers.map(c=>[c.id,c])),em=new Map(d.entries.map(e=>[e.id,e])),im=new Map(d.invoices.map(i=>[i.id,i]));
 for(const c of d.customers){if(typeof c.id!=='string'||!c.id||!c.name||!c.street||!c.zip||!c.city||!RATES.includes(Number(c.rate)))fail('Ungültige Kundendaten')}
 for(const e of d.entries){
  if(typeof e.id!=='string'||!e.id||!cm.has(e.customerId)||!validDate(e.date)||!['time','fee'].includes(e.kind)||!Number.isFinite(lineAmount(e))||lineAmount(e)<0)fail('Ungültige Leistung');
  if(e.kind==='time'&&(!validClock(e.start)||!validClock(e.end)||minutes(e.start,e.end)!==e.minutes||!(e.minutes>0)||!RATES.includes(Number(e.rate))||!TYPES.includes(e.type)))fail('Ungültige Zeit oder Stundensatz');
  if(e.kind==='fee'&&(!money(e.amount)||!FEES.includes(e.type)))fail('Ungültige Auslage');
  if(e.invoiceId&&!im.has(e.invoiceId))fail('Leistung verweist auf fehlende Rechnung');
 }
 const used=new Set();
 for(const i of d.invoices){
  if(typeof i.id!=='string'||!i.id||typeof i.number!=='string'||!/^\d{4}-\d{3,}$/.test(i.number)||!cm.has(i.customerId)||!validDate(i.created)||!validDate(i.start)||!validDate(i.end)||i.start>i.end||!validDate(i.due)||!Array.isArray(i.lines)||!i.lines.length||!Array.isArray(i.payments)||!money(i.total)||!['Entwurf','Versendet','Storniert'].includes(i.status))fail('Ungültige Rechnung oder Status');
  if(!i.recipient||!i.recipient.name||!i.recipient.street||!i.recipient.zip||!i.recipient.city)fail('Ungültiger Rechnungsempfänger');
  if(i.status==='Storniert'&&!validDate(i.cancelledAt))fail('Stornodatum fehlt');
  if(i.sentDate&&!validDate(i.sentDate))fail('Ungültiges Versanddatum');
  if(i.status==='Versendet'&&!validDate(i.sentDate))fail('Versanddatum fehlt');
  if(round(i.lines.reduce((a,l)=>a+l.total,0))!==i.total)fail('Rechnungssumme stimmt nicht');
  for(const l of i.lines){
   const e=em.get(l.entryId);
   if(!e||i.status!=='Storniert'&&used.has(l.entryId)||e.customerId!==i.customerId||!money(l.total))fail('Rechnungsposition passt nicht zur erfassten Leistung');if(i.status!=='Storniert'&&(e.date<i.start||e.date>i.end||e.kind!==l.kind||e.date!==l.date||e.type!==l.type||l.total!==lineAmount(e)))fail('Aktive Rechnungsposition ist verändert');
   if(i.status!=='Storniert'&&e.kind==='time'&&(e.start!==l.start||e.end!==l.end||e.minutes!==l.minutes||e.rate!==l.rate))fail('Rechnungszeit stimmt nicht');
   if(i.status!=='Storniert'&&e.kind==='fee'&&e.amount!==l.amount)fail('Rechnungsauslage stimmt nicht');
   if(i.status==='Storniert'){if(e.invoiceId===i.id)fail('Stornierte Rechnung hat noch zugeordnete Leistungen');}
   else if(e.invoiceId!==i.id)fail('Rechnungszuordnung stimmt nicht');
   if(i.status!=='Storniert')used.add(l.entryId);
  }
  if(i.payments.some(v=>!v.id||!validDate(v.date)||!money(v.amount)||v.amount<=0)||!unique(i.payments.map(v=>v.id))||round(i.payments.reduce((a,v)=>a+v.amount,0))>i.total||i.status==='Storniert'&&i.payments.length)fail('Ungültige Zahlungen');
 }
 for(const e of d.entries){if(e.invoiceId&&!used.has(e.id))fail('Berechnete Leistung fehlt auf Rechnung')}
 for(const [year,next] of Object.entries(d.nextByYear)){if(!/^\d{4}$/.test(year)||!Number.isSafeInteger(next)||next<1)fail('Ungültiger Nummernzähler');let max=0;for(const i of d.invoices){if(i.number.startsWith(year+'-'))max=Math.max(max,Number(i.number.split('-')[1]));}if(next<=max)fail('Nummernzähler liegt hinter bereits vergebenen Rechnungen')}
 return true;
}
function msg(s){notice=s;render()}function customer(cid){return db.customers.find(x=>x.id===cid)}function unbilled(e){return !e.invoiceId};function billed(e){return !!e.invoiceId};function lineAmount(e){return e.kind==='fee'?round(e.amount):round(e.minutes/60*e.rate)}function pending(cid,m){return db.entries.filter(e=>e.customerId===cid&&unbilled(e)&&e.date.startsWith(m)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))};function invoicePaid(i){return round((i.payments||[]).reduce((s,p)=>s+p.amount,0))};function invoiceDue(i){return round(i.total-invoicePaid(i))};function getStatus(i){if(i.status==='Storniert')return 'Storniert';if(invoiceDue(i)<=0&&i.total>0)return 'Bezahlt';if(invoicePaid(i)>0)return 'Teilweise bezahlt';return i.status==='Versendet'?'Versendet':'Entwurf'}function cidOptions(selected='',withAll=false){return (withAll?'<option value="">Alle Kunden</option>':'<option value="">Kunde wählen</option>')+db.customers.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')};function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`};function fields(obj){return Object.entries(obj).map(([k,v])=>`<div class="field"><label>${esc(k)}</label>${v}</div>`).join('')};function field(name,label,type='text',value='',extra=''){return `<div class="field"><label for="${name}">${esc(label)}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`};function select(name,label,options,chosen){return `<div class="field"><label for="${name}">${esc(label)}</label><select name="${name}" id="${name}">${options.map(x=>{let val=Array.isArray(x)?x[0]:x,txt=Array.isArray(x)?x[1]:x;return `<option value="${esc(val)}" ${String(val)===String(chosen)?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`};function btn(text,act,cls='secondary'){return `<button type="button" class="btn ${cls}" data-action="${act}">${text}</button>`};
function home(){const pendingItems=db.entries.filter(unbilled),hours=round(pendingItems.filter(e=>e.kind==='time').reduce((s,e)=>s+e.minutes,0)/60),unbilledSum=round(pendingItems.reduce((s,e)=>s+lineAmount(e),0)),open=round(db.invoices.filter(i=>i.status!=='Storniert').reduce((s,i)=>s+Math.max(0,invoiceDue(i)),0)),invoiced=round(db.invoices.filter(i=>i.status!=='Storniert').reduce((s,i)=>s+i.total,0));const payments=round(db.invoices.filter(i=>i.status!=='Storniert').flatMap(i=>i.payments||[]).reduce((s,p)=>s+p.amount,0));return `<div class="kpis"><div class="kpi"><small>Kunden</small><b>${db.customers.length}/15</b></div><div class="kpi"><small>Nicht berechnete Stunden</small><b>${hours.toLocaleString('de-DE')}</b></div><div class="kpi"><small>Nicht berechnete Leistungen</small><b>${euro(unbilledSum)}</b></div><div class="kpi"><small>Offene Forderungen</small><b>${euro(open)}</b></div><div class="kpi"><small>Rechnungsvolumen</small><b>${euro(invoiced)}</b></div><div class="kpi"><small>Zahlungseingänge</small><b>${euro(payments)}</b></div></div><div style="height:13px"></div>${panel('Schnellzugriff',`<div class="actions">${btn('Neue Leistung','toEntry','')}${btn('Monatsrechnung','toInvoice','gold')}</div><p class="hint">Nicht berechnete Leistungen sind keine offenen Forderungen. Rechnungen werden erst nach ausdrücklicher Erstellung nummeriert und zugeordnet.</p>`)}${panel('Kundenübersicht',db.customers.length?db.customers.map(c=>{const es=db.entries.filter(e=>e.customerId===c.id);const ps=es.filter(unbilled);const cs=db.invoices.filter(i=>i.customerId===c.id&&i.status!=='Storniert');return `<div class="item"><strong>${esc(c.name)}</strong><div class="sub">Erbrachte Stunden: ${(es.filter(e=>e.kind==='time').reduce((s,e)=>s+e.minutes,0)/60).toLocaleString('de-DE',{maximumFractionDigits:2})} · Nicht berechnet: ${euro(ps.reduce((s,e)=>s+lineAmount(e),0))} · Offen: ${euro(cs.reduce((s,i)=>s+Math.max(0,invoiceDue(i)),0))}</div></div>`}).join(''):'<div class="empty">Noch keine Kunden erfasst.</div>')}`}
function customersPage(){if(editCustomer!==null){let c=editCustomer==='new'?{id:'',name:'',street:'',zip:'',city:'',rate:27,notes:''}:customer(editCustomer);if(!c)return '<p>Kunde nicht gefunden.</p>';return panel(c.id?'Kunde bearbeiten':'Neuen Kunden erfassen',`<form id="customerForm">${field('name','Name / Rechnungsempfänger','text',c.name,'required')}${field('street','Straße und Hausnummer','text',c.street,'required')}<div class="grid2">${field('zip','PLZ','text',c.zip,'required')}${field('city','Ort','text',c.city,'required')}</div>${select('rate','Standard-Stundensatz',RATES.map(r=>[r,euro(r)+' / Std.']),c.rate)}<div class="field"><label>Interne Bemerkung</label><textarea name="notes">${esc(c.notes||'')}</textarea></div><div class="actions"><button class="btn" type="submit">Speichern</button>${btn('Abbrechen','cancelCustomer')}</div></form>`)}return panel('Kundenverwaltung',`${db.customers.length<15?btn('＋ Kunde hinzufügen','newCustomer',''):''}<p class="hint">Bis zu 15 Kunden, getrennte Leistungen und Rechnungen.</p>${db.customers.map(c=>`<div class="item"><strong>${esc(c.name)}</strong><div class="sub">${esc(c.street)}, ${esc(c.zip)} ${esc(c.city)} · ${euro(c.rate)}/Std.</div><div class="actions">${btn('Bearbeiten','editCustomer:'+c.id)}${btn('Leistungen','seeCustomer:'+c.id)}</div></div>`).join('')||'<div class="empty">Noch keine Kunden vorhanden.</div>'}`)}
function entryPage(){let e=editEntry?db.entries.find(x=>x.id===editEntry):null;const cid=e?.customerId||selection.customer||db.customers[0]?.id||'';const rate=customer(cid)?.rate||27;const isFee=e?e.kind==='fee':formMode==='fee';return panel(e?'Leistung bearbeiten':'Leistung erfassen',`${db.customers.length===0?'<p class="err">Bitte zuerst einen Kunden anlegen.</p>':`<form id="entryForm">${select('customerId','Kunde',db.customers.map(c=>[c.id,c.name]),cid)}${field('date','Datum','date',e?.date||today(),'required')}<div class="actions">${btn('Mit Zeit','modeTime',!isFee?'':'secondary')}${btn('Ohne Zeit / Auslage','modeFee',isFee?'':'secondary')}</div><input type="hidden" name="kind" value="${isFee?'fee':'time'}">${isFee?`${select('type','Art der Auslage',FEES,e?.type||'Fahrtkostenpauschale')}${field('amount','Betrag (€)','number',e?.amount??10,'required min="0" step="0.01"')}`:`<div class="grid2">${field('start','Beginn','time',e?.start||'','required')}${field('end','Ende','time',e?.end||'','required')}</div>${select('type','Art der Leistung',TYPES,e?.type||TYPES[0])}${select('rate','Stundensatz',RATES.map(r=>[r,euro(r)]),e?.rate||rate)}<p class="hint" id="durationHint">Die Dauer wird aus Beginn und Ende berechnet.</p>`}<div class="field"><label>Bemerkung (intern)</label><textarea name="note">${esc(e?.note||'')}</textarea></div><div class="actions"><button type="submit" class="btn">Speichern</button>${e?btn('Abbrechen','cancelEntry'):''}</div></form>`}`)}
function invoicesPage(){const c=selection.customer||db.customers[0]?.id||'';const m=selection.month;let es=c?pending(c,m):[];let total=round(es.reduce((s,e)=>s+lineAmount(e),0));return `${panel('Monatsrechnung erstellen',`${select('invCustomer','Kunde',db.customers.map(x=>[x.id,x.name]),c)}${field('invMonth','Leistungsmonat','month',m)}<p class="hint">Abrechnungszeitraum: ${dmy(m+'-01')} bis ${dmy(monthEnd(m))} · ${es.length} noch nicht berechnete Position(en)</p><p><strong>Rechnungsbetrag: ${euro(total)}</strong></p><div class="actions">${btn('Positionen prüfen','showPending')}${btn('Rechnung erstellen','createInvoice','gold')}</div><p class="hint">Eine erstellte Rechnung erhält eine feste Nummer und unveränderliche Leistungspositionen. Die PDF-Ausgabe erfolgt über „Drucken“ → „In Dateien sichern“.</p>`)}${panel('Rechnungsregister',`<p class="hint">${STATUSES.map(s=>s+': '+db.invoices.filter(i=>getStatus(i)===s).length).join(' · ')}</p>`+(db.invoices.length?db.invoices.slice().sort((a,b)=>b.created.localeCompare(a.created)||b.number.localeCompare(a.number)).map(i=>`<div class="item"><strong>${esc(i.number)} · ${esc(customer(i.customerId)?.name||i.recipient.name)}</strong><span class="pill">${getStatus(i)}</span><div class="sub">${dmy(i.created)} · ${dmy(i.start)}–${dmy(i.end)} · ${euro(i.total)} · offen ${euro(Math.max(0,invoiceDue(i)))}</div><div class="actions">${btn('Details / PDF','invoice:'+i.id)}</div></div>`).join(''):'<div class="empty">Noch keine Rechnungen erstellt.</div>'))}`}
function settingsPage(){return `${panel('Controlling / Leistungsregister',`${select('reportCustomer','Kunde',[['','Alle Kunden'],...db.customers.map(c=>[c.id,c.name])],selection.customer||'')}${select('reportFilter','Status',[['all','Alle Leistungen'],['pending','Noch nicht berechnet'],['billed','Berechnet']],'all')}<div class="actions">${btn('Leistungen anzeigen','reportEntries','')}${btn('Monatsübersicht','reportMonth')}</div><div id="report"></div>`)}${panel('Sicherung & Wiederherstellung',`<p class="hint">Alle Geschäftsdaten liegen ausschließlich im lokalen Browser-Speicher dieses iPhones. Browserdaten können verloren gehen. Exportiere regelmäßig eine Sicherungsdatei in „Dateien“ (idealerweise iCloud Drive oder einen anderen sicheren Ablageort).</p><div class="actions">${btn('Gesamtsicherung exportieren','backup','')}${btn('Sicherung importieren','import','secondary')}</div><input type="file" id="importFile" accept=".json,application/json" style="display:none"><p class="hint">Ein Import ersetzt den vollständigen aktuellen Datenbestand. Vorher wird eine Sicherung empfohlen.</p>`)}${panel('Rechnungsnummern',`<p class="hint">Format: JJJJ-NNN (z. B. 2026-001), pro Jahr fortlaufend. Falls bereits externe Rechnungen existieren, muss die nächste freie Nummer vor der ersten Rechnung festgelegt werden.</p>${field('seqYear','Jahr','number',new Date().getFullYear(),'min="2000" max="2100"')}${field('seqNext','Nächste freie laufende Nummer','number',db.nextByYear[new Date().getFullYear()]||1,'min="1" step="1"')}${btn('Nächste Nummer speichern','saveSequence','')}`)}${panel('Wichtiger Betriebshinweis','<p class="hint">Diese App hat keinen Benutzer-Login, keine automatische Synchronisierung und keine serverseitige Sicherung. GitHub Pages speichert nur den Programmcode, nicht die Kundendaten. App-Updates dürfen den Browser-Speicher nicht ersetzen; sichere zuvor die Daten. Für Rechnungs-PDF in Safari die Druckansicht öffnen und im iOS-Druckdialog als PDF speichern.</p>')}`}
function invoiceDetails(i){if(!i)return '';const status=getStatus(i);return panel(`Rechnung ${esc(i.number)}`,`<p><strong>${esc(i.recipient.name)}</strong><br>${dmy(i.start)}–${dmy(i.end)} · ${euro(i.total)}<br><span class="pill">${status}</span></p><div class="tableScroll"><table><tr><th>Leistung</th><th>Betrag</th></tr>${i.lines.map(l=>`<tr><td>${dmy(l.date)} ${esc(l.type)} ${l.kind==='time'?`${esc(l.start)}–${esc(l.end)} · ${String(l.minutes/60).replace('.',',')} Std. × ${euro(l.rate)}`:''}</td><td>${euro(l.total)}</td></tr>`).join('')}</table></div><p><b>Bezahlt: ${euro(invoicePaid(i))} · offen: ${euro(Math.max(0,invoiceDue(i)))}</b></p><div class="actions">${btn('Druckansicht / PDF','printInvoice:'+i.id,'gold')}${btn('Schließen','closeInvoice')}</div>${i.status!=='Storniert'?`<div class="field">${field('sentDate','Versanddatum','date',i.sentDate||today())}${btn('Versand dokumentieren','sentInvoice:'+i.id)}</div><h3>Zahlung erfassen</h3><div class="grid2">${field('paymentDate','Zahlungsdatum','date',today())}${field('paymentAmount','Eingegangener Betrag (€)','number',Math.max(0,invoiceDue(i)).toFixed(2),'step="0.01" min="0.01"')}</div>${btn('Zahlung buchen','payInvoice:'+i.id,'')}${(i.payments||[]).map(p=>`<p class="hint">${dmy(p.date)}: ${euro(p.amount)}</p>`).join('')}<details><summary class="dangertext">Rechnung stornieren</summary><p class="hint">Die Rechnung bleibt im Register erhalten. Ihre Positionen werden nach Stornierung erneut zur Abrechnung freigegeben. Bei vorhandenen Zahlungen ist die Stornierung gesperrt.</p>${btn('Rechnung stornieren','cancelInvoice:'+i.id,'warn')}</details>`:''}`)}
function render(){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));let content=tab==='home'?home():tab==='customers'?customersPage():tab==='entry'?entryPage():tab==='invoices'?invoicesPage():settingsPage();document.getElementById('app').innerHTML=(notice?`<div class="ok">${esc(notice)}</div>`:'')+content+(invoiceView?invoiceDetails(db.invoices.find(i=>i.id===invoiceView)):'');notice='';if(tab==='entry')setDuration();}
function get(id){return document.getElementById(id)}function fd(form){return Object.fromEntries(new FormData(form).entries())}function setDuration(){const a=get('start'),b=get('end'),h=get('durationHint');if(!a||!b||!h)return;const mn=minutes(a.value,b.value);h.textContent=mn>0?`Dauer: ${Math.floor(mn/60)} Std. ${mn%60} Min.`:'Ende muss nach Beginn liegen (gleicher Kalendertag).'}
function recordCustomer(f){const x=fd(f);const previous=snapshot();if(!x.name.trim()||!x.street.trim()||!x.zip.trim()||!x.city.trim())return alert('Bitte vollständige Rechnungsanschrift eingeben.');if(editCustomer==='new'&&db.customers.length>=15)return alert('Maximal 15 Kunden.');let c=editCustomer==='new'?{id:id()}:customer(editCustomer);if(!c)return;Object.assign(c,{name:x.name.trim(),street:x.street.trim(),zip:x.zip.trim(),city:x.city.trim(),rate:Number(x.rate),notes:x.notes||''});if(editCustomer==='new')db.customers.push(c);if(!persist(previous))return;editCustomer=null;selection.customer=c.id;msg('Kundendaten gespeichert.');}
function recordEntry(f){let x=fd(f);const previous=snapshot();if(!customer(x.customerId))return alert('Bitte Kunden wählen.');if(!validDate(x.date))return alert('Bitte ein gültiges Datum eingeben.');let e=editEntry?db.entries.find(a=>a.id===editEntry):{id:id()};if(!e||e.invoiceId)return alert('Berechnete Positionen können nicht verändert werden.');const data={customerId:x.customerId,date:x.date,kind:x.kind,type:x.type,note:x.note||'',invoiceId:null};if(x.kind==='time'){let mins=minutes(x.start,x.end);if(!(mins>0)||mins>1439)return alert('Ende muss nach Beginn am selben Tag liegen.');if(!RATES.includes(Number(x.rate)))return alert('Ungültiger Stundensatz.');Object.assign(data,{start:x.start,end:x.end,minutes:mins,rate:Number(x.rate),amount:null});}else{let amount=nval(x.amount);if(!Number.isFinite(amount)||amount<0)return alert('Betrag muss mindestens 0 sein.');Object.assign(data,{start:'',end:'',minutes:0,rate:null,amount:round(amount)});}if(data.kind==='time'){const conflict=overlap(data,editEntry);if(conflict)return alert('Zeitüberschneidung: Für diesen Kunden ist am '+dmy(data.date)+' bereits '+conflict.start+'–'+conflict.end+' erfasst. Bitte erst den bestehenden Eintrag kontrollieren.');}if(data.kind==='fee'&&db.entries.some(z=>z.id!==editEntry&&z.customerId===data.customerId&&z.kind==='fee'&&z.date===data.date&&z.type===data.type&&z.amount===data.amount)){if(!confirm('Für diesen Kunden ist am selben Tag bereits eine identische Auslage erfasst. Trotzdem speichern?'))return;}if(!editEntry)db.entries.push(e);Object.assign(e,data);if(!persist(previous))return;const weitere=confirm('Position gespeichert.\n\nMöchten Sie eine weitere Position erfassen?');selection.customer=x.customerId;editEntry=null;if(weitere){formMode=x.kind;tab='entry';render();}else{tab='home';msg('Position gespeichert.');}}
function createInvoice(){const previous=snapshot();const c=customer(selection.customer);if(!c)return alert('Bitte Kunden wählen.');if(!c.name||!c.street||!c.zip||!c.city)return alert('Rechnungsadresse unvollständig.');const m=selection.month;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m))return alert('Ungültiger Monat.');const es=pending(c.id,m);if(!es.length)return alert('Keine noch nicht berechneten Leistungen in diesem Monat.');const y=today().slice(0,4);let next=db.nextByYear[y];if(!next){const s=prompt(`Erste freie laufende Rechnungsnummer für ${y} (bereits ausgestellte Rechnungen berücksichtigen):`,'1');if(s===null)return;next=Number(s);if(!Number.isInteger(next)||next<1)return alert('Ungültige Rechnungsnummer.');}const number=y+'-'+String(next).padStart(3,'0');if(db.invoices.some(i=>i.number===number))return alert('Rechnungsnummer bereits vorhanden. Bitte in Einstellungen korrigieren.');let start=m+'-01',end=monthEnd(m),created=today();let lines=es.map(e=>({entryId:e.id,date:e.date,kind:e.kind,type:e.type,start:e.start,end:e.end,minutes:e.minutes,rate:e.rate,amount:e.amount,total:lineAmount(e)}));const i={id:id(),number,customerId:c.id,recipient:{name:c.name,street:c.street,zip:c.zip,city:c.city},created,start,end,due:plusDays(created,14),lines,total:round(lines.reduce((s,l)=>s+l.total,0)),status:'Entwurf',sentDate:'',payments:[]};if(!confirm(`Rechnung ${number} über ${euro(i.total)} erstellen? ${es.length} Position(en) werden fest zugeordnet.`))return;db.invoices.push(i);es.forEach(e=>e.invoiceId=i.id);db.nextByYear[y]=next+1;if(!persist(previous))return;invoiceView=i.id;msg('Rechnung erstellt. Positionen sind jetzt fest zugeordnet.');}

function reportEntries(){const cid=get('reportCustomer').value,filter=get('reportFilter').value;let es=db.entries.filter(e=>(!cid||e.customerId===cid)&&(filter==='all'||(filter==='pending'?!e.invoiceId:!!e.invoiceId))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));get('report').innerHTML=`<p class="hint">${es.length} Einträge · Gesamt ${euro(es.reduce((s,e)=>s+lineAmount(e),0))}</p>${es.map(e=>`<div class="item"><strong>${dmy(e.date)} · ${esc(customer(e.customerId)?.name||'Unbekannt')}</strong><div class="sub">${esc(e.type)} · ${e.kind==='time'?`${e.start}–${e.end} (${Math.floor(e.minutes/60)}:${String(e.minutes%60).padStart(2,'0')} h) · `:''}${euro(lineAmount(e))} · ${e.invoiceId?'Berechnet ('+esc(db.invoices.find(i=>i.id===e.invoiceId)?.number||'')+')':'Noch nicht berechnet'}</div>${!e.invoiceId?`<div class="actions">${btn('Bearbeiten','editEntry:'+e.id)}${btn('Löschen','deleteEntry:'+e.id,'warn')}</div>`:''}</div>`).join('')||'<p class="empty">Keine Leistungen gefunden.</p>'}`}
function reportMonth(){const cid=get('reportCustomer').value;let map={};db.entries.filter(e=>!cid||e.customerId===cid).forEach(e=>{const m=e.date.slice(0,7);map[m]??={minutes:0,pending:0,billed:0};if(e.kind==='time')map[m].minutes+=e.minutes;map[m][e.invoiceId?'billed':'pending']+=lineAmount(e)});get('report').innerHTML=Object.keys(map).sort().reverse().map(m=>`<div class="item"><strong>${esc(m)}</strong><div class="sub">Stunden: ${(map[m].minutes/60).toLocaleString('de-DE',{maximumFractionDigits:2})} · Berechnet: ${euro(map[m].billed)} · Noch nicht berechnet: ${euro(map[m].pending)}</div></div>`).join('')||'<p class="empty">Keine Daten.</p>'}
function act(action){let [a,key]=action.split(':');if(a==='toEntry'){tab='entry';editEntry=null}if(a==='toInvoice')tab='invoices';if(a==='newCustomer'){tab='customers';editCustomer='new'}if(a==='editCustomer'){tab='customers';editCustomer=key}if(a==='cancelCustomer')editCustomer=null;if(a==='seeCustomer'){selection.customer=key;tab='settings';render();get('reportCustomer').value=key;reportEntries();return}if(a==='cancelEntry')editEntry=null;if(a==='modeTime'||a==='modeFee'){if(editEntry)return alert('Bitte zuerst Bearbeitung abbrechen.');formMode=a==='modeFee'?'fee':'time'}if(a==='invoice')invoiceView=key;if(a==='closeInvoice')invoiceView=null;if(a==='createInvoice'){createInvoice();return}if(a==='showPending'){const es=pending(selection.customer,selection.month);alert(es.length?es.map(e=>`${dmy(e.date)} ${e.type} ${e.kind==='time'?e.start+'–'+e.end:''}: ${euro(lineAmount(e))}`).join('\n'):'Keine offenen Positionen.');return}if(a==='editEntry'){let e=db.entries.find(x=>x.id===key);if(!e||e.invoiceId)return alert('Berechnete Leistungen sind gesperrt.');editEntry=key;formMode=e.kind;selection.customer=e.customerId;tab='entry'}if(a==='deleteEntry'){let e=db.entries.find(x=>x.id===key);if(!e||e.invoiceId)return alert('Berechnete Leistungen nicht löschbar.');if(!confirm('Unberechnete Leistung wirklich löschen?'))return;const previous=snapshot();db.entries=db.entries.filter(x=>x.id!==key);if(!persist(previous))return}if(a==='printInvoice'){printInvoice(db.invoices.find(i=>i.id===key));return}if(a==='sentInvoice'){let i=db.invoices.find(x=>x.id===key),date=get('sentDate').value;if(!validDate(date))return alert('Gültiges Versanddatum fehlt.');if(i.status==='Storniert'||getStatus(i)==='Bezahlt')return alert('Stornierte oder bezahlte Rechnungen können nicht erneut als versendet markiert werden.');const previous=snapshot();i.sentDate=date;i.status='Versendet';if(!persist(previous))return;msg('Versand dokumentiert.');return}if(a==='payInvoice'){let i=db.invoices.find(x=>x.id===key),date=get('paymentDate').value,amount=nval(get('paymentAmount').value);if(!validDate(date)||!(amount>0))return alert('Bitte gültiges Datum und positiven Betrag eingeben.');if(i.status==='Storniert')return alert('Stornierte Rechnung nicht zahlbar.');if(Math.abs(amount*100-Math.round(amount*100))>0.000001)return alert('Bitte einen Betrag mit maximal zwei Nachkommastellen eingeben.');if(Math.round(amount*100)>Math.round(invoiceDue(i)*100))return alert('Betrag überschreitet die offene Rechnungssumme.');const previous=snapshot();i.payments.push({id:id(),date,amount:round(amount)});if(!persist(previous))return;msg('Zahlung dokumentiert.');return}if(a==='cancelInvoice'){let i=db.invoices.find(x=>x.id===key);if(invoicePaid(i)>0)return alert('Stornierung bei bereits erfassten Zahlungen gesperrt. Zahlungsfall bitte zuerst kaufmännisch klären.');if(!confirm('Rechnung dauerhaft stornieren? Die ursprüngliche Rechnung bleibt im Register. Ihre Positionen können danach erneut abgerechnet werden.'))return;const previous=snapshot();i.status='Storniert';i.cancelledAt=today();db.entries.filter(e=>e.invoiceId===i.id).forEach(e=>e.invoiceId=null);if(!persist(previous))return;msg('Rechnung storniert. Nummer bleibt vergeben.');return}if(a==='reportEntries'){reportEntries();return}if(a==='reportMonth'){reportMonth();return}if(a==='backup'){download('VZ-Gesamtsicherung-'+today()+'.json',JSON.stringify({format:'VZ-BACKUP-1',exported:new Date().toISOString(),data:db},null,2),'application/json');return}if(a==='import'){get('importFile').click();return}if(a==='saveSequence'){const y=Number(get('seqYear').value),next=Number(get('seqNext').value);if(!Number.isInteger(y)||y<2000||y>2100||!Number.isInteger(next)||next<1)return alert('Ungültiges Jahr oder Nummer.');const used=db.invoices.filter(i=>i.number.startsWith(y+'-')).map(i=>Number(i.number.split('-')[1]));if(used.length&&next<=Math.max(...used))return alert('Nummer muss größer als alle bereits in der App genutzten Rechnungsnummern dieses Jahres sein.');const previous=snapshot();db.nextByYear[y]=next;if(!persist(previous))return;msg('Nächste freie Nummer gespeichert.');return}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-tab]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;invoiceView=null;if(tab!=='customers')editCustomer=null;if(tab!=='entry')editEntry=null;render();scrollTo(0,0)}else act(b.dataset.action)});document.addEventListener('submit',e=>{if(e.target.id==='customerForm'){e.preventDefault();recordCustomer(e.target)}if(e.target.id==='entryForm'){e.preventDefault();recordEntry(e.target)}});document.addEventListener('change',e=>{if(e.target.id==='invCustomer'){selection.customer=e.target.value;render()}if(e.target.id==='invMonth'){selection.month=e.target.value;render()}if(e.target.id==='customerId'){selection.customer=e.target.value;const rate=get('rate');if(rate)rate.value=String(customer(e.target.value)?.rate||27)}if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{let p=JSON.parse(reader.result);if(p.format!=='VZ-BACKUP-1')throw Error('Unbekanntes Sicherungsformat');validBackup(p.data);if(!confirm('Achtung: Alle derzeit gespeicherten Daten werden ersetzt. Fortfahren?'))return;const old=snapshot();const damaged=window.storageDamaged;window.storageDamaged=false;db=p.data;if(!persist(old)){window.storageDamaged=damaged;return;}selection={customer:'',month:monthNow()};invoiceView=null;msg('Sicherung importiert.')}catch(err){alert('Import fehlgeschlagen: '+err.message)}};reader.readAsText(f)}});document.addEventListener('input',e=>{if(['start','end'].includes(e.target.id))setDuration()});render();
</script></body></html>
